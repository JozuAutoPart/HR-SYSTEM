<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามแผนเทียบผลผลิตจริง (Plan vs Actual)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

    <!-- Top Navigation Header -->
    <header class="bg-slate-800 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-chart-line text-blue-400 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Plan vs Actual Dashboard</h1>
                    <p class="text-xs text-slate-400">ระบบติดตามและวิเคราะห์ผลการผลิตรายวัน</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="loadSampleData()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg transition flex items-center gap-1 border border-slate-600">
                    <i class="fa-solid fa-database text-amber-400"></i> โหลดข้อมูลตัวอย่าง
                </button>
                <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1 shadow">
                    <i class="fa-solid fa-file-excel"></i> ส่งออก CSV
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">

        <!-- KPI Metric Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <!-- Plan Card -->
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-500 uppercase">เป้าหมายรวม (Plan)</span>
                    <span class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i class="fa-solid fa-bullseye"></i></span>
                </div>
                <div class="mt-2 flex items-baseline justify-between">
                    <span id="kpiPlan" class="text-2xl font-bold text-gray-800">0</span>
                    <span class="text-xs text-gray-500">ชิ้น</span>
                </div>
            </div>

            <!-- Actual Card -->
            <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-200">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-gray-500 uppercase">ผลิตจริงรวม (Actual)</span>
