<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบสแกนเข้า-ออกงาน</title>
</head>
<body>
    <h2>บันทึกเวลาทำงาน</h2>
    <input type="text" id="emp_id" placeholder="รหัสพนักงาน">
    <br><br>
    <button onclick="checkIn('IN')">เข้างาน</button>
    <button onclick="checkIn('OUT')">1ออกงาน</button>

    <script>
        function checkIn(type) {
            const empId = document.getElementById('emp_id').value;
            if (!empId) {
                alert('กรุณากรอกรหัสพนักงาน');
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    // ส่งข้อมูลไปยัง Backend (เช่น PHP / Node.js)
                    sendDataToBackend(empId, type, lat, lon);
                }, error => {
                    alert('ไม่สามารถดึงพิกัด GPS ได้ กรุณาเปิด Location');
                });
            } else {
                alert('เบราว์เซอร์ไม่รองรับระบบระบุพิกัด');
            }
        }

        function sendDataToBackend(empId, type, lat, lon) {
            // ตัวอย่างการส่งข้อมูลด้วย Fetch API
            fetch('save_attendance.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ employee_id: empId, type: type, latitude: lat, longitude: lon })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
            });
        }
    </script>
</body>
</html>
